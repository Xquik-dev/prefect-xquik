[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "prefect-xquik"
version = "0.1.11"
description = "Prefect tasks for scheduled Twitter search, profiles, timelines, trends, and X API workflows. Not affiliated with X Corp."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Xquik" }]
keywords = [
    "data-pipelines",
    "prefect",
    "prefect-collection",
    "prefect-integration",
    "social-media-api",
    "tweet-search",
    "twitter-api",
    "twitter-search",
    "workflow-orchestration",
    "x-api",
    "xquik",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "prefect>=3.8.3",
    "typing-extensions>=4.16.0",
]

[project.urls]
Documentation = "https://docs.xquik.com/guides/prefect"
Homepage = "https://docs.xquik.com/guides/prefect"
Changelog = "https://github.com/Xquik-dev/prefect-xquik/blob/main/CHANGELOG.md"
Issues = "https://github.com/Xquik-dev/prefect-xquik/issues"
Source = "https://github.com/Xquik-dev/prefect-xquik"
"Xquik API Reference" = "https://docs.xquik.com/api-reference/overview"

[project.entry-points."prefect.collections"]
prefect_xquik = "prefect_xquik"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov==7.1.0",
    "pytest-env>=1.1",
    "ruff>=0.16.3",
    "tomli>=2; python_version < '3.11'",
    "twine>=7.0.0",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=prefect_xquik",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
env = ["PREFECT_TEST_MODE=1"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["prefect_xquik"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "TID251", "UP"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Name the precise type. Any switches type checking off."
"typing.cast".msg = "Narrow the value with isinstance or a typed parser. cast skips the check."
"typing_extensions.Any".msg = "Name the precise type. Any switches type checking off."
"typing_extensions.cast".msg = "Narrow the value with isinstance or a typed parser. cast skips the check."

[tool.mypy]
files = [".", ".clusterfuzzlite"]
plugins = ["pydantic.mypy"]
strict = true
strict_bytes = true
strict_equality_for_none = true
warn_unreachable = true
disallow_any_expr = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
    "unused-ignore",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.hatch.build.targets.wheel]
packages = ["prefect_xquik"]
